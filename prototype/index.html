<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --lh: 32px;
    --paper: #faf8f3;
    --ink: #24211c;
    --ink-soft: #6b665d;
    --ink-faint: #a9a298;
    --rule: #e2ddd2;
    --accent: #8a7a5e;
    --fresh: rgba(180,150,80,.28);
    --measure: 33em;
    /* Siempre claro: el papel es papel, y no cambia según el teléfono. */
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); overscroll-behavior:none; }
  body{
    font-family:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size:18px; line-height:var(--lh); font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px 24px 0; }
  .wrap{ width:100%; max-width:var(--measure); }

  /* ---------- reading ---------- */
  /* Vertical: the time of the story, one paragraph per screen.
     Horizontal: the other versions of this same moment. */
  html.snap{ scroll-snap-type:y mandatory; }
  #flow{ position:relative; }
  .screen{
    min-height:100dvh;
    scroll-snap-align:start; scroll-snap-stop:always;
    position:relative; margin-left:-34px;
    padding:75px 0 var(--reserved, 120px) 34px;
  }
  .screen p{ margin:0; text-wrap:pretty; }
  .col{ width:100%; }
  /* The tail of the previous paragraph rises and parks at the top, faint: where
     you came from. It is sticky, so the new paragraph slides underneath it
     instead of pushing it along. Cut by whole fragments, never by height: a
     sentence that starts mid-way cannot be read, and half a fragment is half
     of someone's hand. */
  .before{
    position:sticky; top:75px; z-index:2;
    background:var(--paper); padding-bottom:var(--lh);
    opacity:.4;
  }
  /* The same text must never be on screen twice. Once a paragraph stops being
     the current one, the tail that the next screen already parked fades out. */
  .dup{ transition:opacity .22s ease; }
  .screen:not(.current) .dup{ opacity:0; }
  /* On arrival the new paragraph brightens to be read. */
  @keyframes brighten{
    from{ opacity:.5; }
    to{ opacity:1; }
  }
  .screen.current > .col > p{ animation:brighten .5s ease; }
  .f{ transition:background-color 1s ease; border-radius:2px; }
  .f.fresh{ background-color:var(--fresh); }
  #flow.authorship .f{ background-color:var(--tint); }
  /* in authorship mode the picked fragment deepens and names its hand below */
  #flow.authorship .f.picked{ background-color:var(--tint2); }

  #aviso{
    position:fixed; left:0; right:0; bottom:0; z-index:7;
    padding:16px 24px calc(20px + env(safe-area-inset-bottom));
    background:var(--paper); color:#b4553f; text-align:center;
    transform:translateY(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  #aviso.on{ transform:none; }

  /* ---------- the hand ---------- */
  #hand{
    position:fixed; inset:auto 0 0 0; background:var(--paper);
    border-top:1px solid var(--rule); padding:26px 24px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  #hand.open{ transform:none; }
  #hand .inner{ max-width:var(--measure); margin:0 auto; }
  #handName{ margin:0 0 4px; }
  #handData{ margin-bottom:18px; }
  #handProfile{
    background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .screen.alt > .col > p{ color:var(--ink-soft); }
  /* Backed by you. Outline when it is not, filled when it is, and never a
     number: you see what you gave, not how many gave it. It is also the way
     in — the double tap works, but a heart says so without being explained. */
  /* Arriba del párrafo: a la izquierda en qué versión del momento estás, a la
     derecha si lo respaldaste. Lo del momento y lo del párrafo, separados. */
  .head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px; min-height:16px;
  }
  .versions{ display:flex; gap:6px; align-items:center; }
  .versions i{
    width:5px; height:5px; border-radius:50%; box-sizing:border-box;
    background:var(--rule); transition:background-color .3s, border-color .3s;
  }
  .versions i.on{ background:var(--accent); }
  /* la última, punteada: esa versión no la ha escrito nadie */
  .versions i.slot{ background:none; border:1px dotted var(--ink-faint); }
  .versions i.slot.on{ border-color:var(--accent); }
  .heart{
    padding:0; border:0; background:none;
    color:var(--accent); cursor:pointer; font-size:16px; line-height:1;
  }
  .heart:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }
  .opening{ color:var(--ink-faint); display:block; padding-bottom:var(--lh); }
  /* Writing is reading with a caret in it: same type, same size, same colour,
     no box and no button. It only appears on the screen you are standing on. */
  .write{ display:none; outline:none; }
  .screen.current .write{ display:inline; }
  /* el rotulo se despega del punto anterior; al escribir vuelve a ser un espacio */
  .write.after:empty{ margin-left:.5em; }
  .write:empty::before{
    content:"Sigue escribiendo";
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* ---------- index ---------- */
  .item{ border-top:1px solid var(--rule); padding:22px 0; cursor:pointer; }
  .item:last-child{ border-bottom:1px solid var(--rule); }
  .item:hover .opens{ color:var(--accent); }
  .meta{ color:var(--ink-faint); display:block; margin-top:8px; }

  /* ---------- bar ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px 20px;
    flex-wrap:wrap; padding:18px 24px calc(22px + env(safe-area-inset-bottom));
    color:var(--ink-faint);
    /* fija, no pegajosa: en el telefono la barra de direcciones aparece y
       desaparece al hacer scroll, y una barra sticky se despega del borde */
    position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--paper);
  }
  .grp{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .bar button{
    background:none; border:0; padding:0; cursor:pointer; color:var(--ink-faint);
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; transition:color .2s;
  }
  .bar button:hover{ color:var(--ink); }
  .bar button.on{ color:var(--accent); }
  .bar button:focus-visible, .item:focus-visible, .leafrow:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; }

  /* Five stacked rules above the text: which of the story's five paragraphs you
     are standing on. One fixed indicator, not one repeated per screen. */
  #spine{
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; justify-content:center;
    padding:12px 24px 28px; background:var(--paper);
  }
  #spine .inner{
    width:100%; max-width:var(--measure);
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  #spine .bars{ display:flex; flex-direction:column; gap:5px; }
  /* Saving keeps the story, not the paragraph: it lives with the spine, which
     is the only thing on screen that belongs to the story as a whole. */
  .mark{
    background:none; border:0; padding:0; cursor:pointer;
    color:var(--accent); line-height:0;
  }
  .mark svg path{ fill:none; stroke:currentColor; stroke-width:1.4; }
  .mark.on svg path{ fill:currentColor; }
  .mark:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }
  #spine i{
    height:3px; width:16px; border-radius:2px; box-sizing:border-box;
    background:var(--rule);
    transition:background-color .3s, width .3s, border-color .3s;
  }
  #spine i.on{ background:var(--accent); width:24px; }
  /* a paragraph nobody has written yet is an outline, not a bar */
  #spine i.slot{ background:none; border:1px dashed var(--ink-faint); opacity:.55; }

  .label{ color:var(--ink-faint); display:block; margin-bottom:12px; }

  /* ---------- turn ---------- */
  #turn .label{ margin-bottom:24px; }
  .leafrow{ border-top:1px solid var(--rule); padding:20px 0; cursor:pointer; }
  .leafrow:last-of-type{ border-bottom:1px solid var(--rule); }
  .leafrow .parent{ color:var(--ink-faint); }
  .leafrow:hover .leaf, .leafrow.sel .leaf{ color:var(--accent); }
  .leafrow.taken{ cursor:default; opacity:.45; }
  .leafrow.taken:hover .leaf{ color:inherit; }
  #editor{ margin-top:26px; display:none; }
  #editor.open{ display:block; }
  textarea{
    width:100%; border:0; border-bottom:1px solid var(--rule); background:none; resize:none;
    font-family:inherit; font-size:18px; line-height:var(--lh); color:var(--ink);
    padding:0 0 10px; outline:none; height:calc(var(--lh)*2);
  }
  textarea::placeholder{ color:var(--ink-faint); }
  .counter{ display:flex; justify-content:space-between; margin-top:14px; color:var(--ink-faint); }
  .counter.over{ color:#b4553f; }
  #send{ color:var(--accent); }
  #send[disabled]{ color:var(--ink-faint); cursor:default; }
  .empty{ color:var(--ink-faint); font-style:italic; margin:0; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<main>
  <div class="wrap">

    <section id="reading">
      <div id="flow"></div>
    </section>

    <section id="index" hidden>
      <span class="mono label">Historias abiertas</span>
      <div id="indexList"></div>
    </section>

    <section id="turn" hidden>
      <span class="mono label">Elige a quién continuar</span>
      <div id="leaves"></div>
      <div id="editor">
        <textarea id="text" maxlength="140" placeholder="Continúa…"></textarea>
        <div class="counter mono"><span id="count">0 / 100</span><button id="send" disabled>Publicar</button></div>
      </div>
    </section>

  </div>
</main>

<div id="spine"><div class="inner"><div class="bars"></div><button id="mark" class="mark" title="Guardar esta historia"><svg viewBox="0 0 14 18" width="14" height="18" aria-hidden="true"><path d="M1.6 1.6h10.8v14.8l-5.4-4.4-5.4 4.4z" stroke-linejoin="round"/></svg></button></div></div>

<div class="bar mono">
  <div class="grp">
  </div>
  <div class="grp">
    <button id="bAuthorship">Autoría</button>
    <button id="bDrift" hidden>Deriva</button>
    <span id="turns"></span>
  </div>
</div>

<div id="aviso" class="mono"></div>

<div id="hand"><div class="inner">
  <p id="handName"></p>
  <span class="mono label" id="handData"></span>
  <button id="handProfile" class="mono">Ver perfil</button>
</div></div>

<script>
(function(){
  "use strict";

  /* ---------- la base ----------
     Sin librería: la API de Supabase es REST, así que basta fetch. El
     prototipo sigue siendo un archivo sin dependencias ni build.
     Estas dos claves son públicas por diseño; van dentro del HTML. */
  var BASE = "https://lrcxacnamtuqhitsnvbk.supabase.co/rest/v1";
  var LLAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyY3hhY25hbXR1cWhpdHNudmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTIyNTIsImV4cCI6MjEwNDI2ODI1Mn0.D_CDYG6khu8hucB584Sl9q6Xz0qNLBqkIBEtdSZtp5I";

  /* Quién eres viene en el propio link: tusitio.com/#ana. Sin registro y sin
     contraseña. Es identidad floja a propósito —quien tenga tu link es tú—,
     suficiente entre amigos y no para abrirlo al mundo. */
  var YO = (location.hash || "").replace("#", "").trim() || "you";

  function cabeceras(extra){
    var h = { apikey: LLAVE, Authorization: "Bearer " + LLAVE };
    for(var k in extra) h[k] = extra[k];
    return h;
  }

  function pedir(ruta){
    return fetch(BASE + ruta, { headers: cabeceras() })
      .then(function(r){
        if(!r.ok) throw new Error(ruta + " -> " + r.status);
        return r.json();
      });
  }

  function mandar(metodo, ruta, cuerpo){
    return fetch(BASE + ruta, {
      method: metodo,
      headers: cabeceras({ "Content-Type": "application/json", Prefer: "return=representation" }),
      body: cuerpo ? JSON.stringify(cuerpo) : undefined
    }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok) throw new Error((j && (j.message || j.hint)) || (ruta + " -> " + r.status));
        return j;
      });
    });
  }

  var STORIES = [];

  var TINTS = {ana:"18,90%",bruno:"48,70%",mireia:"160,55%",kai:"280,45%",dana:"5,75%",jonas:"210,60%",olga:"95,55%",sara:"330,55%",ruy:"35,80%",tavo:"250,50%",lia:"185,60%",martin:"60,70%",isis:"300,50%",nube:"200,50%",cielo:"140,50%",you:"25,95%"};

  /* Placeholder pronouns, cycled through the list on purpose: a name does not
     tell you anyone's pronoun, each person tells you their own. In the real
     product this is something people set on their own profile. */
  var PRONOUNS = ["ella", "él", "elle"];
  var PROFILES = {};
  Object.keys(TINTS).forEach(function(a, i){
    if(a !== "you") PROFILES[a] = { pron: PRONOUNS[i % PRONOUNS.length] };
  });

  var state = { story:0, chain:[0], authorship:false, drift:false, rolls:{}, turns:3,
                 pickedLeaf:null, fresh:null, choices:{}, liked:{}, saved:{} };

  var $ = function(s){ return document.querySelector(s); };
  var flow = $("#flow"), root = document.documentElement;

  /* ---------- the tree of paragraphs ----------
     The route is cut into paragraphs where a fragment asks for it and at every
     fork, so a fork always lands on a paragraph break. Each alternate branch
     hangs as a sibling of the canonical paragraph. The paragraph is the screen. */

  var uid = 0;
  function node(frs, from, id){
    return { id: id || ("n" + (uid++)), frs:frs, from:from, kids:[], likes:0 };
  }

  /* Every paragraph is five lines by five different hands. Nobody decides where
     one breaks: the count does. Continuing joins the last paragraph while there
     is room, and opens a new one when it is full. A fork no longer cuts a
     paragraph short — how a fork opens is still to be designed. */
  var LINES = 5;

  /* A story is five paragraphs at most. With five hands per paragraph that is
     also a headcount: twenty-five different people, and then it ends. The
     vertical axis is finite on purpose; only the horizontal one is open-ended.
     The rules above the text follow this number. */
  var PARAS = 5;

  /* Paso 2: se lee de la base, todavía no se escribe en ella. Escribir vuelve
     en el paso 3, con una función que gaste el turno de forma atómica. */
  var ESCRITURA = true;

  /* Cinco versiones por momento. Mientras quede sitio hay una vacía al final;
     cuando están las cinco, ya no. El eje horizontal deja de ser infinito. */
  var VERSIONS = 5;

  /* El árbol se arma desde los fragmentos, que es como vive en la base: cada
     uno con su padre. Un párrafo son cinco fragmentos seguidos por un mismo
     camino, y los hijos del quinto son las versiones del párrafo siguiente —
     por eso una bifurcación solo abre en frontera de párrafo. */
  function build(h){
    var porPadre = {};
    h.frags.forEach(function(f){
      var k = f.parent_id || "raiz";
      (porPadre[k] = porPadre[k] || []).push(f);
    });

    function parrafo(primero){
      var frs = [], f = primero;
      while(f && frs.length < LINES){
        frs.push({ a:f.author_id, t:f.text, id:f.id });
        if(frs.length === LINES) break;
        f = (porPadre[f.id] || [])[0];      // dentro de un párrafo no se bifurca
      }
      var n = node(frs, -1, h.id + ":" + primero.id);
      n.likeKey = primero.id;
      n.ultimo = frs[frs.length - 1].id;
      n.likes = h.likes[primero.id] || 0;
      (porPadre[n.ultimo] || []).forEach(function(kid){ n.kids.push(parrafo(kid)); });
      n.kids.sort(function(a, b){ return b.likes - a.likes; });
      return n;
    }

    var raiz = (porPadre["raiz"] || [])[0];
    return raiz ? parrafo(raiz) : node([], -1, h.id + ":vacia");
  }

  /* Fecundity: how many continuations were born from your fragments. Not an
     invented number, it is counted off the tree: every child is a turn someone
     spent following you. It is the only metric in the system. */
  var hands = null;
  function census(){
    if(hands) return hands;
    hands = {};
    function note(a, kids){
      var m = hands[a] || (hands[a] = { fragments:0, fecundity:0 });
      m.fragments += 1;
      m.fecundity += kids;
    }
    /* Fecundidad: cuántos hijos tiene cada fragmento. Ahora se cuenta directo,
       porque en la base el parentesco está escrito. */
    STORIES.forEach(function(h){
      var hijos = {};
      h.frags.forEach(function(f){
        if(f.parent_id) hijos[f.parent_id] = (hijos[f.parent_id] || 0) + 1;
      });
      h.frags.forEach(function(f){ note(f.author_id, hijos[f.id] || 0); });
    });
    return hands;
  }

  /* Lines already in the story's last paragraph. Five means it is closed. */
  function openLines(h){ return h.route.length % LINES || LINES; }

  /* Five different hands: nobody writes twice in the same paragraph. */
  function alreadyYours(h){
    var filled = openLines(h);
    if(filled === LINES) return false;          // closed, so yours opens a new one
    return h.route.slice(h.route.length - filled).some(function(fr){
      return fr.a === "you";
    });
  }

  function tree(si){
    var h = STORIES[si];
    if(!h.tree) h.tree = build(h);
    return h.tree;
  }

  /* The canon is followed by default. A reader's choice or a die diverts it. */
  function at(pos, n){ return pos + ":" + n.id; }

  function routeOf(si, pos){
    var n = tree(si), route = [];
    while(n){
      route.push(n);
      if(route.length >= PARAS || !n.kids.length) break;
      /* A choice remembers which version, not which position: likes reorder the
         siblings, and a position would then point at somebody else. */
      var key = at(pos, n), pick = null, next = null;
      if(state.drift && state.rolls[key] != null) pick = state.rolls[key];
      else if(state.choices[key] != null) pick = state.choices[key];
      /* Past the last version there is an empty one: reaching the end of the
         versions is itself the invitation to write the next. */
      if(pick === "blank" && n.kids.length && n.kids.length < VERSIONS){
        route.push({ blank:true, frs:[], kids:[], from:-1, id:"b" + n.id, host:n });
        break;
      }
      if(pick != null) n.kids.forEach(function(kid){ if(kid.id === pick) next = kid; });
      n = next || n.kids[0];
    }
    return route;
  }

  function rollFor(pos){
    (function rec(n){
      if(n.kids.length > 1) state.rolls[at(pos, n)] = n.kids[Math.floor(Math.random() * n.kids.length)].id;
      n.kids.forEach(rec);
    })(tree(state.chain[pos]));
  }

  function rollDice(){
    state.rolls = {};
    state.chain.forEach(function(si, pos){ rollFor(pos); });
  }

  /* Reading does not stop at the end of a story: the next one follows, and the
     road ahead is always kept longer than the reader. What chains is finite —
     each story ends — so this is an anthology, not a feed. */
  function extendChain(){
    var last = state.chain[state.chain.length - 1], pool = [];
    STORIES.forEach(function(h, i){ if(i !== last) pool.push(i); });
    state.chain.push(pool.length ? pool[Math.floor(Math.random() * pool.length)] : last);
    /* Only the new stretch gets dice: what you already read must not change. */
    if(state.drift) rollFor(state.chain.length - 1);
  }

  /* One flat list of screens across every story in the chain. */
  function entries(){
    var out = [];
    state.chain.forEach(function(si, s){
      var route = routeOf(si, s);
      route.forEach(function(n, k){
        out.push({ si:si, pos:s, k:k, of:route.length, node:n,
                   parent: k > 0 ? route[k - 1] : null, opens: k === 0 });
      });
    });
    return out;
  }

  /* ---------- reading: one screen per paragraph ---------- */

  function paraHTML(p, echo, pluma){
    /* The fragments the next screen will park at its top are marked: they are
       the same text, so only one of the two copies may ever be visible. */
    var s = "<p>", parked = echo ? [] : tail(p).frs;
    p.frs.forEach(function(fr, x){
      var tinte = TINTS[fr.a] || "0,0%";
      s += (x ? " " : "")
        + '<span class="f' + (!echo && fr.id && fr.id === state.fresh ? " fresh" : "")
        + (parked.indexOf(fr) >= 0 ? " dup" : "")
        + '" data-a="' + fr.a + '"'
        + ' style="--tint:hsla(' + tinte + ',55%,.13);--tint2:hsla(' + tinte + ',55%,.34)">'
        + fr.t + "</span>";
    });
    return s + (pluma ? (p.frs.length ? " " : "") + pluma : "") + "</p>";
  }

  /* The echo always begins at a fragment boundary, so it reads as a whole
     sentence. One fragment is usually enough; if the last one is very short
     ("A question.") the one before it comes along for context. */
  function tail(p){
    var frs = p.frs, from = frs.length - 1;
    if(from > 0 && frs[from].t.length < 45) from -= 1;
    return { frs: frs.slice(from) };
  }

  function echo(p){ return '<div class="before">' + paraHTML(tail(p), true) + "</div>"; }

  function render(){
    var list = entries(), html = "";
    list.forEach(function(e, idx){
      /* Los puntos dicen en qué versión de este momento estás. El último, si
         queda sitio, va punteado: es la que puedes escribir tú. */
      var hermanos = e.parent ? e.parent.kids : [];
      var hueco = hermanos.length > 0 && hermanos.length < VERSIONS;
      var cual = e.node.blank ? hermanos.length : hermanos.indexOf(e.node);
      var puntos = "";
      if(hermanos.length > 1 || hueco){
        for(var d = 0; d < hermanos.length + (hueco ? 1 : 0); d++){
          puntos += '<i class="' + (d === hermanos.length ? "slot " : "")
            + (d === cual ? "on" : "") + '"></i>';
        }
        puntos = '<span class="versions">' + puntos + "</span>";
      }
      var isAlt = !e.node.blank && cual > 0;
      /* You write where the line would go, in the same type as everything else:
         no second screen, no field, no counter. A blank version takes a first
         line, a short one takes the next. */
      /* The open end of a story takes a line too, right where you are reading:
         the last paragraph of a route that still has room. */
      var libre = false;
      if(ESCRITURA && state.turns > 0){
        var cola = !e.node.blank && e.k === e.of - 1;
        libre = e.node.blank || ((e.node.branch || cola)
          && e.node.frs.length < LINES
          && !e.node.frs.some(function(fr){ return fr.a === "you"; }));
      }
      var pluma = libre
        ? '<span class="write' + (e.node.frs.length ? " after" : "")
          + '" contenteditable="plaintext-only" data-i="' + idx + '"></span>'
        : "";
      /* Every story that opens says so where the echo would be, the first one
         included: there is nothing behind it to carry over. */
      var arriba = e.parent ? echo(e.parent)
        : (e.opens ? '<span class="mono opening">Una historia nueva</span>' : "");
      var mio = state.liked[e.si + ":" + e.node.likeKey];
      var corazon = e.node.blank ? ""
        : '<button class="heart" data-i="' + idx + '">'
          + (mio ? "♥" : "♡") + "</button>";
      html += '<div class="screen' + (isAlt ? " alt" : "")
        + (e.node.blank ? " blank" : "") + (mio ? " liked" : "") + '">'
        + '<div class="col">' + arriba
        + ((puntos || corazon)
            ? '<div class="head">' + (puntos || "<span></span>") + corazon + "</div>"
            : "")
        + (e.node.blank ? "<p>" + pluma + "</p>" : paraHTML(e.node, false, pluma))
        + "</div></div>";
    });
    flow.innerHTML = html;
    if(typeof hand !== "undefined") hand.classList.remove("open");
    /* You reached the end, so you can carry it on: the turn opens on that story. */
    Array.prototype.forEach.call(flow.querySelectorAll(".write"), function(w){
      w.addEventListener("keydown", function(ev){
        if(ev.key !== "Enter") return;
        ev.preventDefault();
        var t = w.textContent.trim();
        if(!t) return;
        writeInto(entries()[parseInt(w.dataset.i, 10)], t.slice(0, 100));
      });
      w.addEventListener("input", function(){
        if(w.textContent.length <= 100) return;
        w.textContent = w.textContent.slice(0, 100);
        var r = document.createRange(), sel = window.getSelection();
        r.selectNodeContents(w); r.collapse(false);
        sel.removeAllRanges(); sel.addRange(r);
      });
    });
    measure();
    markCurrent();
  }

  var extending = false;
  function keepAhead(){
    if(extending) return;
    if(currentIndex() < screens().length - 3) return;
    extending = true;
    var y = window.scrollY;
    extendChain();
    render();
    window.scrollTo(0, y);
    extending = false;
  }

  function screens(){ return flow.querySelectorAll(".screen"); }

  function measure(){
    root.style.setProperty("--reserved", ($(".bar").offsetHeight + 24) + "px");
  }

  function currentIndex(){
    var ps = screens(), best = 0, min = Infinity;
    for(var i = 0; i < ps.length; i++){
      var d = Math.abs(ps[i].getBoundingClientRect().top);
      if(d < min){ min = d; best = i; }
    }
    return best;
  }

  function markCurrent(){
    var ps = screens(), k = currentIndex();
    for(var i = 0; i < ps.length; i++) ps[i].classList.toggle("current", i === k);
    paintSpine(entries()[k]);
  }

  /* Where you are inside the story you are reading, out of its five paragraphs. */
  function paintSpine(e){
    var d = $("#spine .bars"), html = "";
    $("#mark").classList.toggle("on", !!(e && state.saved[e.si]));
    var en = e ? e.k : -1, hay = e ? e.of : 0;
    for(var i = 0; i < PARAS; i++){
      var c = i === en ? "on" : (i < hay ? "" : "slot");
      html += '<i class="' + c + '"></i>';
    }
    d.innerHTML = html;
  }

  function goToScreen(k){
    var ps = screens();
    if(!ps[k]) return;
    window.scrollTo(0, window.scrollY + ps[k].getBoundingClientRect().top);
    markCurrent();
  }

  /* The horizontal axis resolves the fork by hand: it switches sibling, and with
     it everything hanging below. The vertical axis moves through story time.

     Versions are ordered left to right and the canon is the leftmost one. There
     is a single gesture, right to left, and it always advances: past the last
     one you come back to the canon. */
  /* El eje horizontal tiene dos extremos y no da la vuelta: se avanza hacia un
     lado y se regresa hacia el otro. Los puntos ya dicen dónde estás, así que
     los topes se ven; con la vuelta puesta uno no sabía si iba o volvía. */
  function otherVersion(dir){
    var list = entries(), k = currentIndex(), e = list[k];
    if(!e || !e.parent) return;
    var kids = e.parent.kids;
    var ultimo = kids.length - 1 + (kids.length < VERSIONS ? 1 : 0);
    if(ultimo < 1) return;
    var current = e.node.blank ? kids.length : kids.indexOf(e.node);
    var sig = current + dir;
    if(sig < 0 || sig > ultimo) return;          // en los extremos, nada
    state.choices[at(e.pos, e.parent)] = sig === kids.length ? "blank" : kids[sig].id;
    if(state.drift){ state.drift = false; $("#bDrift").classList.remove("on"); }
    render();
    goToScreen(k);
  }

  var tX = 0, tY = 0, touching = false, ultimoToque = {};
  window.addEventListener("touchstart", function(e){
    if($("#reading").hidden || e.touches.length !== 1) return;
    touching = true; tX = e.touches[0].clientX; tY = e.touches[0].clientY;
  }, {passive:true});
  window.addEventListener("touchend", function(e){
    if(!touching) return;
    touching = false;
    var t = e.changedTouches[0], dx = t.clientX - tX, dy = t.clientY - tY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6){
      otherVersion(dx < 0 ? 1 : -1);
      return;
    }
    /* A tap that did not move: two of them in a row back the paragraph. The
       browser's own dblclick is unreliable on touch — it competes with
       double-tap-to-zoom — so the two taps get counted here. */
    if(Math.abs(dx) > 12 || Math.abs(dy) > 12) return;
    if(t.target && t.target.closest && t.target.closest(".heart")) return;
    var ahora = Date.now(), donde = t.target && t.target.closest && t.target.closest(".screen");
    if(donde && donde === ultimoToque.donde && ahora - ultimoToque.cuando < 340){
      ultimoToque = {};
      likeEnPantalla(donde);
      return;
    }
    ultimoToque = { donde: donde, cuando: ahora };
  }, {passive:true});

  var lastSide = 0;
  window.addEventListener("wheel", function(e){
    if($("#reading").hidden) return;
    if(Math.abs(e.deltaX) < 24 || Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.4) return;
    if(Date.now() - lastSide < 700) return;
    lastSide = Date.now();
    otherVersion(e.deltaX > 0 ? 1 : -1);
  }, {passive:true});

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") sign(null);
    if($("#reading").hidden) return;
    if(e.key === "ArrowRight") otherVersion(1);
    if(e.key === "ArrowLeft") otherVersion(-1);
  });

  window.addEventListener("scroll", function(){
    if($("#reading").hidden) return;
    markCurrent();
    keepAhead();
  }, {passive:true});
  window.addEventListener("resize", function(){
    if($("#reading").hidden) return;
    measure(); markCurrent();
  });

  /* Double tap backs a paragraph. There is no count anywhere: what you see is
     not how many liked it, it is which version the likes made canon. */
  /* El corazón se pinta de inmediato y se guarda después: el pulgar no debe
     esperar a la red. Si la base falla, se deshace y se avisa. */
  function toggleLike(e){
    var h = STORIES[e.si], key = e.node.likeKey, mio = e.si + ":" + key;
    var quitando = !!state.liked[mio];

    if(quitando){
      delete state.liked[mio];
      h.likes[key] = Math.max(0, (h.likes[key] || 0) - 1);
    } else {
      state.liked[mio] = 1;
      h.likes[key] = (h.likes[key] || 0) + 1;
      var padre = e.parent;
      if(padre) state.choices[at(e.pos, padre)] = e.node.id;
    }
    h.tree = null;
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);

    var camino = "/likes?person_id=eq." + encodeURIComponent(YO)
      + "&paragraph_id=eq." + encodeURIComponent(key);
    var promesa = quitando
      ? mandar("DELETE", camino)
      : mandar("POST", "/likes", { person_id: YO, paragraph_id: key });

    promesa.catch(function(err){
      if(quitando){ state.liked[mio] = 1; h.likes[key] = (h.likes[key] || 0) + 1; }
      else { delete state.liked[mio]; h.likes[key] = Math.max(0, (h.likes[key] || 0) - 1); }
      h.tree = null;
      render();
      avisar("No se pudo guardar: " + err.message);
    });
  }

  function likeEnPantalla(sc){
    var ps = screens(), idx = -1;
    for(var i = 0; i < ps.length; i++) if(ps[i] === sc) idx = i;
    var e = entries()[idx];
    if(!e || e.node.blank) return;
    toggleLike(e);
  }

  /* The bookmark belongs to the story you are standing in, whichever that is. */
  $("#mark").addEventListener("click", function(){
    var e = entries()[currentIndex()];
    if(!e) return;
    var id = STORIES[e.si].id, quitando = !!state.saved[e.si];
    if(quitando) delete state.saved[e.si]; else state.saved[e.si] = 1;
    this.classList.toggle("on", !quitando);

    var boton = this;
    var camino = "/bookmarks?person_id=eq." + encodeURIComponent(YO)
      + "&story_id=eq." + encodeURIComponent(id);
    var promesa = quitando
      ? mandar("DELETE", camino)
      : mandar("POST", "/bookmarks", { person_id: YO, story_id: id });

    promesa.catch(function(err){
      if(quitando) state.saved[e.si] = 1; else delete state.saved[e.si];
      boton.classList.toggle("on", quitando);
      avisar("No se pudo guardar: " + err.message);
    });
  });

  flow.addEventListener("dblclick", function(ev){
    if(ev.target.closest(".heart")) return;
    var sc = ev.target.closest(".screen");
    if(sc) likeEnPantalla(sc);
  });

  flow.addEventListener("click", function(ev){
    var h = ev.target.closest(".heart");
    if(!h) return;
    ev.stopPropagation();
    var e = entries()[parseInt(h.dataset.i, 10)];
    if(e) toggleLike(e);
  });

  /* With authorship on, tapping a fragment tells you whose hand that is. */
  var hand = $("#hand");

  function plural(n, uno, varios){ return n + " " + (n === 1 ? uno : varios); }

  function sign(el){
    Array.prototype.forEach.call(flow.querySelectorAll(".picked"), function(x){
      x.classList.remove("picked");
    });
    if(!el){ hand.classList.remove("open"); return; }
    el.classList.add("picked");

    var a = el.dataset.a, m = census()[a] || { fragments:0, fecundity:0 };
    var pron = a === "you" ? "" : (PROFILES[a] || {}).pron;
    $("#handName").textContent = a === "you" ? "tú" : a;
    $("#handName").style.color = "hsl(" + (TINTS[a] || "0,0%") + ",58%)";
    $("#handData").textContent = (pron ? pron + " · " : "")
      + plural(m.fragments, "fragmento", "fragmentos") + " · "
      + plural(m.fecundity, "continuación", "continuaciones");
    hand.classList.add("open");
  }

  hand.addEventListener("click", function(){ sign(null); });
  /* Placeholder: the profile does not exist yet. */
  $("#handProfile").addEventListener("click", function(e){ e.stopPropagation(); });

  flow.addEventListener("click", function(e){
    if(!state.authorship) return;
    var el = e.target.closest(".f");
    sign(el && flow.contains(el) ? el : null);
  });

  $("#bAuthorship").addEventListener("click", function(){
    state.authorship = !state.authorship;
    flow.classList.toggle("authorship", state.authorship);
    this.classList.toggle("on", state.authorship);
    if(!state.authorship) sign(null);
  });

  /* Drift = chance resolves every fork. Same action as the horizontal axis, but
     automatic and all at once. */
  $("#bDrift").addEventListener("click", function(){
    state.drift = !state.drift;
    this.classList.toggle("on", state.drift);
    if(state.drift){ state.choices = {}; rollDice(); }
    mode("read");
  });

  function mode(m){
    $("#reading").hidden = m !== "read";
    $("#index").hidden  = m !== "index";
    $("#turn").hidden   = m !== "turn";
    ["#bAuthorship","#spine"].forEach(function(s){
      $(s).style.visibility = m === "read" ? "visible" : "hidden";
    });
    root.classList.toggle("snap", m === "read");
    if(m === "read"){ render(); keepAhead(); }
    if(m === "index") paintIndex();
    if(m === "turn") paintLeaves();
    window.scrollTo(0, 0);
  }

  function paintIndex(){
    $("#indexList").innerHTML = STORIES.map(function(h, i){
      var who = {};
      h.route.forEach(function(f){ who[f.a] = 1; });
      var forks = Object.keys(h.forks).length;
      return '<div class="item" tabindex="0" data-h="' + i + '">'
        + '<span class="opens">' + h.route[0].t + "</span>"
        + '<span class="meta mono">' + plural(h.route.length, "fragmento", "fragmentos")
        + " · " + plural(Object.keys(who).length, "mano", "manos")
        + (forks ? " · " + plural(forks, "bifurcación", "bifurcaciones") : "") + "</span></div>";
    }).join("");
    Array.prototype.forEach.call($("#indexList").querySelectorAll(".item"), function(el){
      var openStory = function(){
        state.story = parseInt(el.dataset.h, 10);
        state.chain = [state.story];
        state.choices = {};
        if(state.drift) rollDice();
        mode("read");
      };
      el.addEventListener("click", openStory);
      el.addEventListener("keydown", function(e){ if(e.key === "Enter") openStory(); });
    });
  }

  function paintLeaves(){
    var cont = $("#leaves");

    if(state.turns <= 0){
      cont.innerHTML = '<p class="empty">Sin turnos. Vuelven el lunes.</p>';
      $("#editor").classList.remove("open");
      return;
    }
    cont.innerHTML = STORIES.map(function(h, i){
      var n = h.route.length, llenas = openLines(h);
      var parent = n > 1 ? h.route[n-2].t : "";
      var tuya = alreadyYours(h);
      var estado = tuya ? "tu línea ya está en este párrafo"
        : llenas === LINES ? "abre un párrafo nuevo"
        : "línea " + (llenas + 1) + " de " + LINES;
      return '<div class="leafrow' + (tuya ? " taken" : "") + '" tabindex="0" data-h="' + i + '">'
        + (parent ? '<span class="parent">' + parent + "</span> " : "")
        + '<span class="leaf">' + h.route[n-1].t + "</span>"
        + '<span class="meta mono">' + estado + "</span></div>";
    }).join("");
    Array.prototype.forEach.call(cont.querySelectorAll(".leafrow"), function(el){
      if(el.classList.contains("taken")) return;
      el.addEventListener("click", function(){
        Array.prototype.forEach.call(cont.querySelectorAll(".leafrow"), function(x){ x.classList.remove("sel"); });
        el.classList.add("sel");
        state.pickedLeaf = parseInt(el.dataset.h, 10);
        $("#editor").classList.add("open");
        $("#text").focus();
      });
    });
  }

  $("#text").addEventListener("input", function(){
    var n = this.value.trim().length;
    $("#count").textContent = n + " / 100";
    $("#count").parentNode.classList.toggle("over", n > 100);
    $("#send").disabled = !(n > 0 && n <= 100 && state.pickedLeaf !== null);
  });

  /* La línea cuelga del último fragmento del párrafo que estabas leyendo: si es
     una versión vacía, del que la abre; si no, del último que tenga. La base
     decide si cabe —turnos, cinco manos, cinco párrafos— y contesta. */
  function writeInto(e, t){
    if(!e) return;
    var padre = e.node.blank ? e.node.host.ultimo
      : e.node.frs[e.node.frs.length - 1].id;

    mandar("POST", "/rpc/write_line", { p_person: YO, p_parent: padre, p_text: t })
      .then(function(nuevo){
        var f = nuevo && nuevo.length ? nuevo[0] : nuevo;
        var h = STORIES[e.si];
        h.frags.push(f);
        h.tree = null;
        hands = null;
        state.turns = Math.max(0, state.turns - 1);
        state.fresh = f.id;
        updateTurns();
        render();
        var recien = flow.querySelector(".f.fresh");
        if(recien){
          var ps = screens(), suya = recien.closest(".screen");
          for(var x = 0; x < ps.length; x++) if(ps[x] === suya) goToScreen(x);
          setTimeout(function(){ recien.classList.remove("fresh"); state.fresh = null; }, 2400);
        }
      })
      .catch(function(err){ avisar(err.message); });
  }

  $("#send").addEventListener("click", function(){
    var t = $("#text").value.trim();
    var fr = { a:"you", t:t };
    var h = STORIES[state.pickedLeaf];
    h.route.push(fr);
    h.tree = null;                       // the tree is rebuilt with the new fragment
    hands = null;                         // and the census of hands is recounted
    state.turns--;
    state.story = state.pickedLeaf;
    state.chain = [state.story];
    state.fresh = fr;
    state.choices = {};
    state.drift = false;
    $("#bDrift").classList.remove("on");
    $("#text").value = "";
    $("#count").textContent = "0 / 100";
    $("#send").disabled = true;
    $("#editor").classList.remove("open");
    state.pickedLeaf = null;
    updateTurns();
    mode("read");
    var justAdded = flow.querySelector(".f.fresh");
    if(justAdded){
      var ps = screens(), own = justAdded.closest(".screen");
      for(var i = 0; i < ps.length; i++) if(ps[i] === own) goToScreen(i);
    }
    setTimeout(function(){
      if(justAdded) justAdded.classList.remove("fresh");
      state.fresh = null;
    }, 2400);
  });

  /* Cuando la base rechaza algo hay que decirlo, pero sin montar una pantalla:
     una línea abajo que se va sola. */
  function avisar(texto){
    var d = $("#aviso");
    d.textContent = texto;
    d.classList.add("on");
    clearTimeout(avisar.t);
    avisar.t = setTimeout(function(){ d.classList.remove("on"); }, 3800);
  }

  function updateTurns(){
    $("#turns").textContent = state.turns + (state.turns === 1 ? " turno" : " turnos");
  }

  /* Nada que leer hasta que llegue de la base. */
  updateTurns();
  flow.innerHTML = '<div class="screen"><div class="col">'
    + '<span class="mono opening">Trayendo las historias…</span></div></div>';

  Promise.all([
    pedir("/stories?select=id,created_at&order=created_at"),
    pedir("/fragments?select=id,story_id,parent_id,author_id,text,created_at&order=created_at"),
    pedir("/likes?select=person_id,paragraph_id"),
    pedir("/bookmarks?select=story_id&person_id=eq." + encodeURIComponent(YO)),
    pedir("/people?select=id,turns&id=eq." + encodeURIComponent(YO))
  ]).then(function(res){
    var historias = res[0], fragmentos = res[1], respaldos = res[2];
    var guardadas = res[3], quienSoy = res[4];

    if(!quienSoy.length) throw new Error("no existe la persona '" + YO + "'");
    state.turns = quienSoy[0].turns;
    updateTurns();

    var cuenta = {};
    respaldos.forEach(function(l){ cuenta[l.paragraph_id] = (cuenta[l.paragraph_id] || 0) + 1; });

    var porHistoria = {};
    fragmentos.forEach(function(f){
      (porHistoria[f.story_id] = porHistoria[f.story_id] || []).push(f);
    });

    STORIES = historias
      .map(function(h){ return { id:h.id, frags: porHistoria[h.id] || [], likes: cuenta, tree: null }; })
      .filter(function(h){ return h.frags.length; });

    if(!STORIES.length) throw new Error("la base no devolvió historias");

    /* Lo tuyo: qué respaldaste y qué guardaste. */
    STORIES.forEach(function(h, i){
      h.frags.forEach(function(f){
        if(respaldos.some(function(l){ return l.person_id === YO && l.paragraph_id === f.id; })){
          state.liked[i + ":" + f.id] = 1;
        }
      });
      if(guardadas.some(function(b){ return b.story_id === h.id; })) state.saved[i] = 1;
    });

    state.chain = [0];
    mode("read");
  }).catch(function(e){
    flow.innerHTML = '<div class="screen"><div class="col">'
      + '<span class="mono opening">No se pudo leer la base</span>'
      + "<p>" + e.message + "</p></div></div>";
  });
})();
</script>
</body>
</html>
