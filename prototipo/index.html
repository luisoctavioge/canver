<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --lh: 32px;
    --paper: #faf8f3;
    --ink: #24211c;
    --ink-soft: #6b665d;
    --ink-faint: #a9a298;
    --rule: #e2ddd2;
    --accent: #8a7a5e;
    --marca: rgba(180,150,80,.28);
    --measure: 33em;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#12120f; --ink:#e4dfd4; --ink-soft:#8e887c; --ink-faint:#5b564d; --rule:#2a2823; --accent:#b3a179; --marca:rgba(179,161,121,.22); }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); overscroll-behavior:none; }
  body{
    font-family:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size:18px; line-height:var(--lh); font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }

  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px 24px 0; }
  .wrap{ width:100%; max-width:var(--measure); }

  /* ---------- lectura ---------- */
  /* Vertical: el tiempo de la historia, un párrafo por pantalla.
     Horizontal: las otras versiones de este mismo momento. */
  html.leyendo{ scroll-snap-type:y mandatory; }
  #flow{ position:relative; }
  .pantalla{
    min-height:calc(100dvh - var(--resta, 120px));
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; align-items:center;
    position:relative; padding-left:34px; margin-left:-34px;
  }
  .pantalla p{ margin:0; text-wrap:pretty; }
  .col{ width:100%; }
  /* la cola del párrafo anterior asoma arriba, tenue: de dónde vienes.
     Al cambiar de rama es el mismo padre con otra continuación. */
  .antes{
    max-height:calc(var(--lh) * 2); overflow:hidden;
    display:flex; align-items:flex-end;
    margin-bottom:var(--lh); opacity:.4;
  }
  /* Al llegar la pantalla: el párrafo que acabas de leer sigue subiendo un poco,
     frena y se apaga arriba; el nuevo se aclara para leerse. */
  @keyframes asentar{
    from{ opacity:.82; transform:translateY(9px); }
    to{ opacity:.4; transform:none; }
  }
  @keyframes aclarar{
    from{ opacity:.5; }
    to{ opacity:1; }
  }
  .pantalla.activa .antes{ animation:asentar .42s cubic-bezier(.16,.84,.44,1); }
  .pantalla.activa > .col > p{ animation:aclarar .5s ease; }
  .f{ transition:background-color 1s ease; border-radius:2px; }
  .f.nuevo{ background-color:var(--marca); }
  #flow.autoria .f{ background-color:var(--tint); }
  /* en modo autoría, el fragmento señalado sube de tono y da su nombre abajo */
  #flow.autoria .f.senalado{ background-color:var(--tint2); }

  /* ---------- la mano ---------- */
  #mano{
    position:fixed; inset:auto 0 0 0; background:var(--paper);
    border-top:1px solid var(--rule); padding:26px 24px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  #mano.abierta{ transform:none; }
  #mano .inner{ max-width:var(--measure); margin:0 auto; }
  #manoNombre{ margin:0 0 4px; }
  #manoDatos{ margin-bottom:18px; }
  #manoPerfil{
    background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  /* la marca solo dice que este momento tiene otra versión */
  .pantalla.bifurca::before{
    content:"*"; position:absolute; left:0; top:50%; margin-top:-16px;
    width:22px; text-align:right; color:var(--ink-faint);
    font-size:13px; line-height:var(--lh); transition:color .3s;
  }
  .pantalla.bifurca.activa::before{ color:var(--accent); }
  .pantalla.alterna > .col > p{ color:var(--ink-soft); }
  .cierre{ color:var(--ink-faint); }
  .fin{ display:block; margin-bottom:16px; }
  #bOtra{
    background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
  }

  /* ---------- índice ---------- */
  .item{ border-top:1px solid var(--rule); padding:22px 0; cursor:pointer; }
  .item:last-child{ border-bottom:1px solid var(--rule); }
  .item:hover .abre{ color:var(--accent); }
  .item .meta{ color:var(--ink-faint); display:block; margin-top:8px; }

  /* ---------- barra ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px 20px;
    flex-wrap:wrap; padding:18px 24px calc(22px + env(safe-area-inset-bottom));
    color:var(--ink-faint);
    position:sticky; bottom:0; background:var(--paper);
  }
  .grp{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .bar button{
    background:none; border:0; padding:0; cursor:pointer; color:var(--ink-faint);
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; transition:color .2s;
  }
  .bar button:hover{ color:var(--ink); }
  .bar button.on{ color:var(--accent); }
  .bar button:focus-visible, .item:focus-visible, .hoja:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; }

  .et{ color:var(--ink-faint); display:block; margin-bottom:12px; }

  /* ---------- turno ---------- */
  #turno .et{ margin-bottom:24px; }
  .hoja{ border-top:1px solid var(--rule); padding:20px 0; cursor:pointer; }
  .hoja:last-of-type{ border-bottom:1px solid var(--rule); }
  .hoja .padre{ color:var(--ink-faint); }
  .hoja:hover .leaf, .hoja.sel .leaf{ color:var(--accent); }
  #editor{ margin-top:26px; display:none; }
  #editor.abierto{ display:block; }
  textarea{
    width:100%; border:0; border-bottom:1px solid var(--rule); background:none; resize:none;
    font-family:inherit; font-size:18px; line-height:var(--lh); color:var(--ink);
    padding:0 0 10px; outline:none; height:calc(var(--lh)*2);
  }
  textarea::placeholder{ color:var(--ink-faint); }
  .conta{ display:flex; justify-content:space-between; margin-top:14px; color:var(--ink-faint); }
  .conta.excedido{ color:#b4553f; }
  #enviar{ color:var(--accent); }
  #enviar[disabled]{ color:var(--ink-faint); cursor:default; }
  .vacio{ color:var(--ink-faint); font-style:italic; margin:0; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<main>
  <div class="wrap">

    <section id="lectura">
      <div id="flow"></div>
    </section>

    <section id="indice" hidden>
      <span class="mono et">Historias abiertas</span>
      <div id="listaIndice"></div>
    </section>

    <section id="turno" hidden>
      <span class="mono et">Elige a quién continuar</span>
      <div id="hojas"></div>
      <div id="editor">
        <textarea id="texto" maxlength="140" placeholder="Continúa…"></textarea>
        <div class="conta mono"><span id="cuenta">0 / 100</span><button id="enviar" disabled>Publicar</button></div>
      </div>
    </section>

  </div>
</main>

<div class="bar mono">
  <div class="grp">
    <button id="bLeer" class="on">Leer</button>
    <button id="bIndice">Índice</button>
    <button id="bTurno">Continuar</button>
  </div>
  <div class="grp">
    <button id="bAutoria">Autoría</button>
    <button id="bDeriva">Deriva</button>
    <span id="turnos"></span>
  </div>
</div>

<div id="mano"><div class="inner">
  <p id="manoNombre"></p>
  <span class="mono et" id="manoDatos"></span>
  <button id="manoPerfil" class="mono">Ver perfil</button>
</div></div>

<script>
(function(){
  "use strict";

  var HISTORIAS = [
    { id:"tren",
      ruta:[
        {a:"ana",t:"El último tren salió sin nadie adentro y aun así llegó tarde."},
        {a:"bruno",t:"En la estación, el jefe anotó la hora exacta en un cuaderno que nadie le había pedido."},
        {a:"mireia",t:"Llevaba once años anotando trenes vacíos."},
        {a:"kai",t:"Su letra se había ido encogiendo hasta que cuatro años cabían en una página."},
        {a:"dana",t:"Esa noche escribió algo distinto."},
        {a:"dana",t:"Una pregunta."},
        {a:"jonas",t:"¿Y si el tren sí lleva a alguien, y los que dejamos de ver somos nosotros?"},
        {a:"olga",t:"Cerró el cuaderno antes de arrepentirse."},
        {a:"sara",t:"Afuera, la nieve caía sin llegar a tocar el suelo.",p:1},
        {a:"ruy",t:"Un perro cruzó las vías en dirección contraria a la costumbre."},
        {a:"tavo",t:"El jefe lo siguió, porque no tenía nada mejor que hacer con el insomnio."},
        {a:"lia",t:"El perro se detuvo frente a una puerta que él no recordaba haber visto nunca."},
        {a:"martin",t:"Era la puerta de su casa."},
        {a:"martin",t:"Pero del lado equivocado de la calle."},
        {a:"isis",t:"Adentro alguien había dejado la luz encendida y la mesa puesta para dos.",p:1},
        {a:"nube",t:"El jefe llevaba veinte años cenando solo."},
        {a:"bruno",t:"Se sentó igual, del lado que no era suyo."},
        {a:"cielo",t:"La sopa estaba tibia, como si alguien acabara de salir por la otra puerta."},
        {a:"ana",t:"No había otra puerta."},
        {a:"kai",t:"En el cuaderno la pregunta seguía abierta, y las preguntas abiertas pesan.",p:1},
        {a:"dana",t:"Decidió responderla con los pies."},
        {a:"jonas",t:"Volvió a la estación pisando sus propias huellas, que ya no estaban."},
        {a:"olga",t:"El andén estaba lleno."},
        {a:"mireia",t:"Gente en abrigo, con boletos, mirando un reloj que él nunca había instalado."},
        {a:"sara",t:"Ninguno hacía ruido."},
        {a:"ruy",t:"Los reconoció a todos: eran las horas que había anotado durante once años."},
        {a:"tavo",t:"Una mujer se acercó y le devolvió el cuaderno, que él llevaba en la mano.",p:1},
        {a:"lia",t:"«Lo estuvimos leyendo», dijo. «Es lo único que llega puntual»."},
        {a:"martin",t:"Él quiso preguntar quiénes eran."},
        {a:"isis",t:"Preguntó otra cosa."},
        {a:"nube",t:"«¿Y si me subo?»"},
        {a:"cielo",t:"Nadie contestó, pero todos se hicieron a un lado."},
        {a:"ana",t:"El tren llegó vacío, como siempre, y por primera vez eso pareció una invitación.",p:1},
        {a:"bruno",t:"Subió con el cuaderno bajo el brazo y sin apagar la luz de la estación."},
        {a:"kai",t:"Las puertas se cerraron con el sonido de una página al pasar."},
        {a:"dana",t:"Por la ventana vio al jefe de estación anotando la hora exacta."},
        {a:"dana",t:"Levantó la mano para saludarse."},
        {a:"jonas",t:"El vagón olía a papel mojado y a inviernos que no le habían tocado.",p:1},
        {a:"olga",t:"En cada asiento había un cuaderno distinto, abierto en una pregunta."},
        {a:"mireia",t:"Ninguna era la suya."},
        {a:"sara",t:"Entendió que le tocaba contestar una."},
        {a:"ruy",t:"Escogió la más corta, porque el tren no iba a esperar."},
        {a:"tavo",t:"Decía: «¿Quién enciende la luz de las casas vacías?»",p:1},
        {a:"lia",t:"Escribió debajo, con su letra encogida: «Alguien que va llegando»."},
        {a:"martin",t:"El tren frenó sin estación."},
        {a:"isis",t:"Afuera no había nieve: había noviembre, y una calle con dos aceras iguales."},
        {a:"nube",t:"Bajó."},
        {a:"cielo",t:"La casa tenía la mesa puesta para dos y la sopa tibia.",p:1},
        {a:"ana",t:"Esta vez se sentó del lado suyo."},
        {a:"bruno",t:"Dejó el cuaderno abierto en la página que seguía."},
        {a:"kai",t:"Y esperó, sin apuro, a que alguien más llegara tarde."}
      ],
      nudos:{
        7:{ rama:[
          {a:"ruy",t:"El cuaderno se quedó abierto toda la noche, y la nieve entró a leerlo."},
          {a:"dana",t:"Por la mañana la tinta se había corrido hasta formar otra pregunta."},
          {a:"olga",t:"Nadie la leyó nunca, porque el jefe no volvió a la estación."}
        ]},
        14:{ rama:[
          {a:"cielo",t:"Pero él ya no estaba seguro de cuál lado era el suyo."},
          {a:"kai",t:"Tocó, por si acaso, y le abrió un hombre con su misma cara cansada."},
          {a:"sara",t:"Los dos entendieron al mismo tiempo que sobraba uno."},
          {a:"nube",t:"Ninguno se movió."}
        ]},
        22:{ rama:[
          {a:"nube",t:"La nieve había borrado la estación entera y, aun así, el reloj seguía."},
          {a:"martin",t:"Anotó la hora en el aire, con el dedo, porque ya no había cuaderno."},
          {a:"lia",t:"Fue la primera vez en once años que llegó a tiempo."}
        ]},
        31:{ rama:[
          {a:"sara",t:"«Nadie se sube», dijo la mujer. «Uno se queda hasta que el tren se lo lleva»."},
          {a:"jonas",t:"Él miró el andén lleno y contó: once años, once inviernos, once trenes."},
          {a:"isis",t:"Se quedó, y siguió anotando, ahora acompañado."}
        ]},
        41:{ rama:[
          {a:"isis",t:"No contestó ninguna: escribió una nueva y la dejó abierta para el siguiente."},
          {a:"bruno",t:"El vagón entero pasó la página al mismo tiempo."},
          {a:"ana",t:"Y el tren siguió, ya sin destino, recogiendo preguntas."}
        ]}
      }
    },
    { id:"biblioteca",
      ruta:[
        {a:"olga",t:"La biblioteca cerró en 1994 y siguió recibiendo devoluciones."},
        {a:"ruy",t:"Los libros aparecían en el buzón sin remitente, siempre en buen estado."},
        {a:"dana",t:"Alguien los leía con un cuidado que ya no se estila."},
        {a:"lia",t:"El bibliotecario nunca fue reemplazado: simplemente dejó de envejecer."}
      ], nudos:{}
    },
    { id:"sal",
      ruta:[
        {a:"mireia",t:"Mi abuela guardaba la sal en un frasco con la etiqueta de otra cosa."},
        {a:"tavo",t:"Decía que así la sal no se enteraba de que era sal y duraba más."},
        {a:"ana",t:"Cuando murió encontramos catorce frascos y ninguna etiqueta correcta."}
      ], nudos:{}
    }
  ];

  var TINTES = {ana:"18,90%",bruno:"48,70%",mireia:"160,55%",kai:"280,45%",dana:"5,75%",jonas:"210,60%",olga:"95,55%",sara:"330,55%",ruy:"35,80%",tavo:"250,50%",lia:"185,60%",martin:"60,70%",isis:"300,50%",nube:"200,50%",cielo:"140,50%",tu:"25,95%"};

  /* Pronombres de ejemplo. Van en ciclo por el orden de la lista, a propósito:
     un nombre no dice el pronombre de nadie, lo dice cada quien de sí. En el
     producto real esto es un dato que la persona pone en su perfil. */
  var PRONOMBRES = ["ella", "él", "elle"];
  var PERFILES = {};
  Object.keys(TINTES).forEach(function(a, i){
    if(a !== "tu") PERFILES[a] = { pron: PRONOMBRES[i % PRONOMBRES.length] };
  });

  var estado = { historia:0, autoria:false, deriva:false, rolls:{}, turnos:3,
                 hojaSel:null, nuevo:null, elecciones:{} };

  var $ = function(s){ return document.querySelector(s); };
  var flow = $("#flow"), raiz = document.documentElement;

  /* ---------- el árbol de párrafos ----------
     La ruta se corta en párrafos donde el fragmento lo pide y en cada nudo, para
     que la bifurcación caiga siempre en un cambio de párrafo. Cada rama alterna
     cuelga como hermana del párrafo canónico. El párrafo es la pantalla. */

  var uid = 0;
  function nodo(frs, desde){ return { id:"n" + (uid++), frs:frs, desde:desde, hijos:[], peso:0 }; }

  /* Peso = fragmentos acumulados en el subárbol, o sea turnos que la gente gastó
     por ese camino. El hijo de más peso es el canon, y va primero. */
  function pesar(n){
    n.peso = n.frs.length;
    n.hijos.forEach(function(h){ n.peso += pesar(h); });
    n.hijos.sort(function(a, b){ return b.peso - a.peso; });
    return n.peso;
  }

  function construir(h){
    var corta = {};
    h.ruta.forEach(function(fr, i){ if(fr.p) corta[i] = 1; });
    Object.keys(h.nudos).forEach(function(k){ corta[k] = 1; });

    var parrafos = [], actual = null;
    h.ruta.forEach(function(fr, i){
      if(!actual || corta[i]){ actual = nodo([], i); parrafos.push(actual); }
      actual.frs.push(fr);
    });
    for(var j = 0; j < parrafos.length - 1; j++) parrafos[j].hijos.push(parrafos[j + 1]);

    Object.keys(h.nudos).forEach(function(k){
      var j = -1;
      parrafos.forEach(function(p, x){ if(p.desde === parseInt(k, 10)) j = x; });
      if(j > 0) parrafos[j - 1].hijos.push(nodo(h.nudos[k].rama.slice(), -1));
    });

    pesar(parrafos[0]);
    return parrafos[0];
  }

  /* Fecundidad: cuántas continuaciones nacieron de tus fragmentos. No es un dato
     inventado, se cuenta sobre el árbol: cada hijo es un turno que alguien gastó
     en seguirte. Es la única métrica del sistema. */
  var manos = null;
  function censo(){
    if(manos) return manos;
    manos = {};
    function anota(a, hijos){
      var m = manos[a] || (manos[a] = { fragmentos:0, fecundidad:0 });
      m.fragmentos += 1;
      m.fecundidad += hijos;
    }
    HISTORIAS.forEach(function(h){
      h.ruta.forEach(function(fr, i){
        anota(fr.a, (i + 1 < h.ruta.length ? 1 : 0) + (h.nudos[i + 1] ? 1 : 0));
      });
      Object.keys(h.nudos).forEach(function(k){
        var r = h.nudos[k].rama;
        r.forEach(function(fr, j){ anota(fr.a, j + 1 < r.length ? 1 : 0); });
      });
    });
    return manos;
  }

  function arbol(){
    var h = HISTORIAS[estado.historia];
    if(!h.arbol) h.arbol = construir(h);
    return h.arbol;
  }

  /* Por defecto se sigue el canon. Una elección del lector o un dado lo desvían. */
  function rutaActual(){
    var n = arbol(), ruta = [];
    while(n){
      ruta.push(n);
      if(!n.hijos.length) break;
      var i = 0;
      if(estado.deriva && estado.rolls[n.id] != null) i = estado.rolls[n.id];
      else if(estado.elecciones[n.id] != null) i = estado.elecciones[n.id];
      n = n.hijos[Math.min(i, n.hijos.length - 1)];
    }
    return ruta;
  }

  function tirarDados(){
    estado.rolls = {};
    (function rec(n){
      if(n.hijos.length > 1) estado.rolls[n.id] = Math.floor(Math.random() * n.hijos.length);
      n.hijos.forEach(rec);
    })(arbol());
  }

  /* ---------- lectura: una pantalla por párrafo ---------- */

  function parrafoHTML(p, eco){
    var s = "<p>";
    p.frs.forEach(function(fr, x){
      var tinte = TINTES[fr.a] || "0,0%";
      s += (x ? " " : "")
        + '<span class="f' + (!eco && fr === estado.nuevo ? " nuevo" : "")
        + '" data-a="' + fr.a + '"'
        + ' style="--tint:hsla(' + tinte + ',55%,.13);--tint2:hsla(' + tinte + ',55%,.34)">'
        + fr.t + "</span>";
    });
    return s + "</p>";
  }

  function eco(p){ return '<div class="antes">' + parrafoHTML(p, true) + "</div>"; }

  function render(){
    var ruta = rutaActual(), html = "";
    ruta.forEach(function(p, k){
      var padre = k > 0 ? ruta[k - 1] : null;
      var bifurca = !!(padre && padre.hijos.length > 1);
      var alterna = bifurca && padre.hijos.indexOf(p) > 0;
      html += '<div class="pantalla' + (bifurca ? " bifurca" : "") + (alterna ? " alterna" : "") + '">'
        + '<div class="col">' + (padre ? eco(padre) : "") + parrafoHTML(p, false) + "</div></div>";
    });
    html += '<div class="pantalla cierre"><div class="col">'
      + eco(ruta[ruta.length - 1])
      + '<span class="mono fin">La historia se detuvo aquí</span>'
      + '<button id="bOtra" class="mono">Otra historia</button></div></div>';
    flow.innerHTML = html;
    if(typeof mano !== "undefined") mano.classList.remove("abierta");
    $("#bOtra").addEventListener("click", function(){ modo("indice"); });
    medir();
    marcarActiva();
  }

  function pantallas(){ return flow.querySelectorAll(".pantalla"); }

  function medir(){
    raiz.style.setProperty("--resta", ($(".bar").offsetHeight + 24) + "px");
  }

  function indiceActual(){
    var ps = pantallas(), mejor = 0, min = Infinity;
    for(var i = 0; i < ps.length; i++){
      var d = Math.abs(ps[i].getBoundingClientRect().top);
      if(d < min){ min = d; mejor = i; }
    }
    return mejor;
  }

  function marcarActiva(){
    var ps = pantallas(), k = indiceActual();
    for(var i = 0; i < ps.length; i++) ps[i].classList.toggle("activa", i === k);
  }

  function irAPantalla(k){
    var ps = pantallas();
    if(!ps[k]) return;
    window.scrollTo(0, window.scrollY + ps[k].getBoundingClientRect().top);
    marcarActiva();
  }

  /* El eje horizontal resuelve el nudo a mano: cambia de hermano y con él todo lo
     que cuelga hacia abajo. El vertical avanza en el tiempo de la historia.

     Las versiones se ordenan de izquierda a derecha y el canon es la de más a la
     izquierda. El gesto es uno solo, de derecha a izquierda, y siempre avanza:
     al pasar la última se vuelve al canon. */
  function siguienteVersion(){
    var ruta = rutaActual(), k = indiceActual();
    if(k <= 0 || k >= ruta.length) return;
    var padre = ruta[k - 1];
    if(padre.hijos.length < 2) return;
    var actual = padre.hijos.indexOf(ruta[k]);
    estado.elecciones[padre.id] = (actual + 1) % padre.hijos.length;
    if(estado.deriva){ estado.deriva = false; $("#bDeriva").classList.remove("on"); }
    render();
    irAPantalla(k);
  }

  var tX = 0, tY = 0, tocando = false;
  window.addEventListener("touchstart", function(e){
    if($("#lectura").hidden || e.touches.length !== 1) return;
    tocando = true; tX = e.touches[0].clientX; tY = e.touches[0].clientY;
  }, {passive:true});
  window.addEventListener("touchend", function(e){
    if(!tocando) return;
    tocando = false;
    var t = e.changedTouches[0], dx = t.clientX - tX, dy = t.clientY - tY;
    if(dx < -60 && -dx > Math.abs(dy) * 1.6) siguienteVersion();
  }, {passive:true});

  var ultimoLado = 0;
  window.addEventListener("wheel", function(e){
    if($("#lectura").hidden) return;
    if(e.deltaX < 24 || e.deltaX < Math.abs(e.deltaY) * 1.4) return;
    if(Date.now() - ultimoLado < 700) return;
    ultimoLado = Date.now();
    siguienteVersion();
  }, {passive:true});

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") firmar(null);
    if($("#lectura").hidden) return;
    if(e.key === "ArrowRight") siguienteVersion();
  });

  window.addEventListener("scroll", function(){
    if(!$("#lectura").hidden) marcarActiva();
  }, {passive:true});
  window.addEventListener("resize", function(){
    if($("#lectura").hidden) return;
    medir(); marcarActiva();
  });

  /* Con autoría encendida, tocar un fragmento dice de quién es esa mano. */
  var mano = $("#mano");

  function plural(n, uno, varios){ return n + " " + (n === 1 ? uno : varios); }

  function firmar(el){
    Array.prototype.forEach.call(flow.querySelectorAll(".senalado"), function(x){
      x.classList.remove("senalado");
    });
    if(!el){ mano.classList.remove("abierta"); return; }
    el.classList.add("senalado");

    var a = el.dataset.a, m = censo()[a] || { fragmentos:0, fecundidad:0 };
    var pron = a === "tu" ? "" : (PERFILES[a] || {}).pron;
    $("#manoNombre").textContent = a === "tu" ? "tú" : a;
    $("#manoNombre").style.color = "hsl(" + (TINTES[a] || "0,0%") + ",58%)";
    $("#manoDatos").textContent = (pron ? pron + " · " : "")
      + plural(m.fragmentos, "fragmento", "fragmentos") + " · "
      + plural(m.fecundidad, "continuación", "continuaciones");
    mano.classList.add("abierta");
  }

  mano.addEventListener("click", function(){ firmar(null); });
  /* Placeholder: el perfil no existe todavía. */
  $("#manoPerfil").addEventListener("click", function(e){ e.stopPropagation(); });

  flow.addEventListener("click", function(e){
    if(!estado.autoria) return;
    var el = e.target.closest(".f");
    firmar(el && flow.contains(el) ? el : null);
  });

  $("#bAutoria").addEventListener("click", function(){
    estado.autoria = !estado.autoria;
    flow.classList.toggle("autoria", estado.autoria);
    this.classList.toggle("on", estado.autoria);
    if(!estado.autoria) firmar(null);
  });

  /* Deriva = el azar resuelve todos los nudos. Es la misma acción que el eje
     horizontal, pero automática y de golpe. Ahora sí se apaga. */
  $("#bDeriva").addEventListener("click", function(){
    estado.deriva = !estado.deriva;
    this.classList.toggle("on", estado.deriva);
    if(estado.deriva){ estado.elecciones = {}; tirarDados(); }
    modo("leer");
  });

  function modo(m){
    $("#lectura").hidden = m !== "leer";
    $("#indice").hidden  = m !== "indice";
    $("#turno").hidden   = m !== "turno";
    $("#bLeer").classList.toggle("on", m === "leer");
    $("#bIndice").classList.toggle("on", m === "indice");
    $("#bTurno").classList.toggle("on", m === "turno");
    ["#bAutoria","#bDeriva"].forEach(function(s){
      $(s).style.visibility = m === "leer" ? "visible" : "hidden";
    });
    raiz.classList.toggle("leyendo", m === "leer");
    if(m === "leer") render();
    if(m === "indice") pintarIndice();
    if(m === "turno") pintarHojas();
    window.scrollTo(0, 0);
  }
  $("#bLeer").addEventListener("click", function(){ modo("leer"); });
  $("#bIndice").addEventListener("click", function(){ modo("indice"); });
  $("#bTurno").addEventListener("click", function(){ modo("turno"); });

  function pintarIndice(){
    $("#listaIndice").innerHTML = HISTORIAS.map(function(h, i){
      var manos = {};
      h.ruta.forEach(function(f){ manos[f.a] = 1; });
      var nudos = Object.keys(h.nudos).length;
      return '<div class="item" tabindex="0" data-h="' + i + '">'
        + '<span class="abre">' + h.ruta[0].t + "</span>"
        + '<span class="meta mono">' + h.ruta.length + " fragmentos · "
        + Object.keys(manos).length + " manos"
        + (nudos ? " · " + nudos + " bifurcaciones" : "") + "</span></div>";
    }).join("");
    Array.prototype.forEach.call($("#listaIndice").querySelectorAll(".item"), function(el){
      var abrir = function(){
        estado.historia = parseInt(el.dataset.h, 10);
        estado.elecciones = {};
        if(estado.deriva) tirarDados();
        modo("leer");
      };
      el.addEventListener("click", abrir);
      el.addEventListener("keydown", function(e){ if(e.key === "Enter") abrir(); });
    });
  }

  function pintarHojas(){
    var cont = $("#hojas");
    if(estado.turnos <= 0){
      cont.innerHTML = '<p class="vacio">Sin turnos. Vuelven el lunes.</p>';
      $("#editor").classList.remove("abierto");
      return;
    }
    cont.innerHTML = HISTORIAS.map(function(h, i){
      var n = h.ruta.length;
      var padre = n > 1 ? h.ruta[n-2].t : "";
      return '<div class="hoja" tabindex="0" data-h="' + i + '">'
        + (padre ? '<span class="padre">' + padre + "</span> " : "")
        + '<span class="leaf">' + h.ruta[n-1].t + "</span></div>";
    }).join("");
    Array.prototype.forEach.call(cont.querySelectorAll(".hoja"), function(el){
      el.addEventListener("click", function(){
        Array.prototype.forEach.call(cont.querySelectorAll(".hoja"), function(x){ x.classList.remove("sel"); });
        el.classList.add("sel");
        estado.hojaSel = parseInt(el.dataset.h, 10);
        $("#editor").classList.add("abierto");
        $("#texto").focus();
      });
    });
  }

  $("#texto").addEventListener("input", function(){
    var n = this.value.trim().length;
    $("#cuenta").textContent = n + " / 100";
    $("#cuenta").parentNode.classList.toggle("excedido", n > 100);
    $("#enviar").disabled = !(n > 0 && n <= 100 && estado.hojaSel !== null);
  });

  $("#enviar").addEventListener("click", function(){
    var t = $("#texto").value.trim();
    var h = HISTORIAS[estado.hojaSel];
    var fr = { a:"tu", t:t, p:(h.ruta.length % 5 === 0 ? 1 : 0) };
    h.ruta.push(fr);
    h.arbol = null;                       // el árbol se reconstruye con el fragmento nuevo
    manos = null;                         // y el censo de manos se recuenta
    estado.turnos--;
    estado.historia = estado.hojaSel;
    estado.nuevo = fr;
    estado.elecciones = {};
    estado.deriva = false;
    $("#bDeriva").classList.remove("on");
    $("#texto").value = "";
    $("#cuenta").textContent = "0 / 100";
    $("#enviar").disabled = true;
    $("#editor").classList.remove("abierto");
    estado.hojaSel = null;
    actualizarTurnos();
    modo("leer");
    var recien = flow.querySelector(".f.nuevo");
    if(recien){
      var ps = pantallas(), suya = recien.closest(".pantalla");
      for(var i = 0; i < ps.length; i++) if(ps[i] === suya) irAPantalla(i);
    }
    setTimeout(function(){
      if(recien) recien.classList.remove("nuevo");
      estado.nuevo = null;
    }, 2400);
  });

  function actualizarTurnos(){
    $("#turnos").textContent = estado.turnos + (estado.turnos === 1 ? " turno" : " turnos");
  }

  actualizarTurnos();
  modo("leer");
})();
</script>
</body>
</html>
